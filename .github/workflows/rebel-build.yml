name: Rebel Astro build

on:
  push:
    branches:
      - main
      - codex/rebel-living-hero
  pull_request:
    paths:
      - "web-astro/**"
      - ".github/workflows/rebel-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Source copy clarity check
        run: npm run check:copy

      - name: Astro check and build
        run: npm run build

      - name: Rendered-site copy audit
        id: rendered_copy_audit
        run: npm run check:rendered-copy

      - name: Upload rendered-copy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-copy-audit
          path: web-astro/copy-audit-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebel-source-snapshot
          path: |
            web-astro/src
            web-astro/public
            web-astro/scripts
            web-astro/package.json
            web-astro/astro.config.mjs
          retention-days: 2
