<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Immagine in arrivo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171227" />
      <stop offset="1" stop-color="#0e0b18" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c8ff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.10" />
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#shine)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <g opacity="0.92">
    <rect x="220" y="330" width="1160" height="240" rx="22" fill="#0b0814" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.10" />
    <text x="800" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="44" fill="#ffffff" fill-opacity="0.92">
      Immagine in arrivo
    </text>
    <text x="800" y="498" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" fill="#ffffff" fill-opacity="0.72">
      Placeholder editoriale - inserire asset reale
    </text>
  </g>
</svg>
